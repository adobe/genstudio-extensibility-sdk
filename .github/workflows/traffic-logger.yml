name: Save GitHub Clone History

on:
  schedule:
    # Runs every Sunday at 00:00 UTC to safely capture the rolling 14-day window
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          ref: 'traffic'
          fetch-depth: 0

      - name: Create traffic branch if missing
        run: |
          if ! git show-ref --verify --quiet refs/heads/traffic; then
            git checkout --orphan traffic
            git rm -rf .
            echo "# Repository Traffic Logs" > README.md
            echo "[]" > history.json
            git add README.md history.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@://github.com"
            git commit -m "Initialize traffic branch"
            git push origin traffic
          else
            git checkout traffic
          fi

      - name: Fetch and Merge Clone Data
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRAFFIC_SECRET: ${{ secrets.TRAFFIC_SECRET }}
        run: |
          # Fetch the raw data from GitHub API
          curl -H "Authorization: token $TRAFFIC_SECRET" \
               -H "Accept: application/vnd.github+json" \
               "https://github.com" \
               > latest_fetch.json
          
          # Use Python to merge new logs into history.json, filtering out duplicate timestamps
          python3 -c "
          import json, os, datetime
          
          # Load existing history or create an empty list
          history_file = 'history.json'
          if os.path.exists(history_file):
              try:
                  with open(history_file, 'r') as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []
          
          # Create a map of existing records by their timestamp to prevent duplicates
          history_map = {item['timestamp']: item for item in history}
          
          # Load newly fetched data
          with open('latest_fetch.json', 'r') as f:
              new_data = json.load(f)
          
          # Process the 'clones' array from the GitHub response
          new_clones = new_data.get('clones', [])
          for record in new_clones:
              ts = record['timestamp']
              # Overwrite or add the record (GitHub data changes slightly for very recent days)
              history_map[ts] = {
                  'timestamp': ts,
                  'count': record['count'],
                  'uniques': record['uniques']
              }
          
          # Sort the history by timestamp so it stays in chronological order
          sorted_history = sorted(history_map.values(), key=lambda x: x['timestamp'])
          
          # Save back to history.json
          with open(history_file, 'w') as f:
              json.dump(sorted_history, f, indent=2)
          "
          
          # Clean up temporary fetch file
          rm latest_fetch.json

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add history.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated update of clone traffic statistics - $(date +%Y-%m-%d)"
            git push origin traffic
          else
            echo "No new data to log."
          fi
